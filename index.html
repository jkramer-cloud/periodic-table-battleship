function collectSettings(){for(let key of ['level','opponent','attack','difficulty','ai','p1','p2']){const el=document.getElementById(key);if(el)CFG[key]=el.value.trim()||CFG[key]};for(let key of ['coverage','timer'])CFG[key]=+document.getElementById(key).value;CFG.reference=document.getElementById('reference').checked;if(CFG.difficulty==='nightmare'&&(CFG.timer===0||CFG.timer>15))CFG.timer=15;}
function pathsFor(size,orient){const key=available.length+'-'+size+'-'+orient;if(allPathsMemo[key])return allPathsMemo[key];const paths=[];for(const e of available){let path=[];for(let t=0;t<size;t++){const z=POS[`${e.row+(orient==='v'?t:0)}-${e.col+(orient==='h'?t:0)}`];if(!z||!availableSet.has(z))break;path.push(z)}if(path.length===size)paths.push(path)}return allPathsMemo[key]=paths;}
function fits(z,len,orient,occupied){const e=BY_Z[z],cells=[];if(!e)return null;for(let i=0;i<len;i++){const p=POS[`${e.row+(orient==='v'?i:0)}-${e.col+(orient==='h'?i:0)}`];if(!p||!availableSet.has(p)||occupied.has(p))return null;cells.push(p)}return cells;}
function randomFleet(){const all=fleet.map((size,i)=>({size,i}));for(let attempt=0;attempt<24;attempt++){const filled=new Set(),chosen=[];let bad=false;for(let ship of all){const choices=shuffle([...pathsFor(ship.size,'h'),...pathsFor(ship.size,'v')]);const found=choices.find(c=>c.every(z=>!filled.has(z)));if(!found){bad=true;break}found.forEach(z=>filled.add(z));chosen.push({length:ship.size,cells:found})}if(!bad)return chosen} // Backtrack if unlucky
 const solve=(idx,filled,chosen)=>{if(idx===all.length)return chosen;const opts=shuffle([...pathsFor(all[idx].size,'h'),...pathsFor(all[idx].size,'v')]);for(const cells of opts){if(cells.some(z=>filled.has(z)))continue;const next=new Set([...filled,...cells]);const ans=solve(idx+1,next,[...chosen,{length:all[idx].size,cells}]);if(ans)return ans}return null};return solve(0,new Set(),[])||[];}
function begin(){collectSettings();available=ELEMENTS.filter(e=>e.z<=CFG.coverage);availableSet=new Set(available.map(e=>e.z));allPathsMemo={};fleet=[...FLEETS[CFG.coverage]];players=[player(CFG.p1,false),player(CFG.opponent==='computer'?'Computer Captain':CFG.p2,CFG.opponent==='computer')];if(players[1].computer)players[1].ships=randomFleet();active=0;placementIndex=0;orientation='h';phase='placement';winner=-1;turns=0;rounds=0;mistakes=0;message='Select the first tile of the highlighted ship, or place the whole fleet automatically.';render();}

function tileMarkup(e,opts){const sh=opts.ships?.some(s=>s.cells.includes(e.z));const hit=opts.shots?.[e.z]==='hit',miss=opts.shots?.[e.z]==='miss';const canClick=opts.interactive&&(!hit&&!miss);const selected=opts.selected===e.z;let className='tile';const categories={'Alkali metal':'alkali','Alkaline earth metal':'alkaline','Noble gas':'noble','Halogen':'halogen','Nonmetal':'nonmetal','Metalloid':'metalloid','Transition metal':'transition','Lanthanide':'lanthanide','Actinide':'actinide','Post-transition metal':'post'};className+=' '+(categories[e.cat]||'post');if(sh)className+=' ship';if(hit)className+=' hit';if(miss)className+=' miss';if(canClick)className+=' interactive';if(selected)className+=' selected';const showName=CFG.reference&&(CFG.level==='explorer'||opts.showNames);const title=CFG.reference?`${e.name} (${e.s}) • ${e.z} • ${e.mass} u • ${e.cat}`:`Element ${e.z} (${e.s})`;return `<button type="button" class="${className}" data-z="${e.z}" ${canClick?'': 'disabled'} title="${esc(title)}" aria-label="${esc(opts.interactive?(opts.mode==='place'?'Place ship beginning at ':'Attack '):'Element ')}${esc(e.name)}"><span class="num">${e.z}</span><span class="sym">${e.s}</span>${showName?`<span class="ename">${esc(e.name)}</span>`:''}${hit?'<span class="mark">✕</span>':miss?'<span class="mark">·</span>':''}</button>`;}
function board(opts){let out='<div class="board-scroller"><div class="swipe-tip">↔ Swipe sideways to see all 18 element groups</div><div class="ptable" role="group" aria-label="Periodic table grid">';out+='<div class="axis"></div>';for(let g=1;g<=18;g++)out+=`<div class="axis">${g}</div>`;const maxRow=CFG.coverage===118?10:(CFG.coverage<=36?4:5);for(let row=1;row<=maxRow;row++){if(row===8){out+='<div class="sep"></div>';continue}out+=`<div class="axis period">${row<=7?row:row===9?'La':'Ac'}</div>`;for(let col=1;col<=18;col++){if(row===6&&col===3||row===7&&col===3){out+=`<div class="tile placeholder">${CFG.coverage===118?(row===6?'57–71 ↓':'89–103 ↓'):'f-block'}</div>`;continue}const z=POS[`${row}-${col}`];const e=z?BY_Z[z]:null;if(!e||!availableSet.has(e.z)){out+='<div class="hole" aria-hidden="true"></div>';continue}out+=tileMarkup(e,opts)}}out+='</div></div>';return out;}

function renderPlacement(){const p=players[active],occ=p.ships.flatMap(s=>s.cells);const placeTitle=`${esc(p.name)} — place your fleet`;const html=`<div class="play"><section class="leftcol"><div class="card board-card">${titleBar(placeTitle,`${CFG.coverage} ELEMENT BOARD`)}<div class="hint">The gaps are real periodic-table gaps. Choose a starting element for your next ship. Ships cannot overlap or cross empty spaces.</div>${board({mode:'place',ships:p.ships,interactive:placementIndex<fleet.length})}<div class="legend"><span><i class="dot"></i>Your ships are shaded silver</span><span>↔ Horizontal or ↕ Vertical</span></div></div></section><aside class="sidebar"><div class="card"><div class="turn-label">DEPLOY YOUR FLEET</div><div class="bigline">${placementIndex<fleet.length?`Place a ${fleet[placementIndex]}-element ship`:'Fleet ready!'}</div>${fleetChips(p)}<div class="btnrow"><button class="btn alt" data-action="rotate">${orientation==='h'?'↔ Horizontal':'↕ Vertical'} — rotate</button><button class="btn alt" data-action="auto">Auto-place fleet</button><button class="btn ghost" data-action="clear">Clear placement</button></div><div class="notice ${placementIndex===fleet.length?'good':''}" role="status">${esc(message)}</div><button class="btn" style="width:100%" data-action="ready" ${placementIndex<fleet.length?'disabled':''}>${p.computer?'Continue':CFG.opponent==='human'&&active===0?'Continue to Player 2':'Start battle'} →</button></div><div class="card rules"><h3>Placement rules</h3><p>Ships occupy consecutive element tiles in a row or column. A blank space or the gap above the detached f-block breaks a ship.</p></div></aside></div>`;return html;}

function placementReady(){if(placementIndex!==fleet.length)return;if(CFG.opponent==='human'&&active===0){prepPlayerTwo();return}active=0;turns=0;if(CFG.opponent==='human'){phase='handoff';handoffNext='playing';render()}else startHumanTurn();}
function newTurnKind(){return CFG.attack==='mixed'?(players[active].turnShots%2===0?'click':'clue'):CFG.attack;}
function startHumanTurn(){phase='playing';question=null;clue=null;attempts=0;feedback='';attackKind=newTurnKind();if(attackKind==='clue'){const unshot=available.filter(e=>!players[active].shots[e.z]);if(unshot.length===0){phase='gameover';winner=-1;return}clue=buildClue(rand(unshot));startClock()}render();}
function rotate(){orientation=orientation==='h'?'v':'h';message=`Orientation changed to ${orientation==='h'?'horizontal':'vertical'}.`;render();}
function ownShipStats(p){const other=players[1-players.indexOf(p)];const sunk=p.ships.filter(s=>s.cells.every(z=>other.shots[z]==='hit')).length;return `${p.ships.length-sunk}/${p.ships.length} afloat`;}
function playContent(){const p=players[active],opp=players[1-active],fired=Object.keys(p.shots).length;const clueMode=attackKind==='clue';const canShoot=phase==='playing';const selected=question?.z;const mainboard=board({mode:'enemy',shots:p.shots,selected,interactive:canShoot});const homeboard=board({mode:'home',ships:p.ships,shots:opp.shots,interactive:false});let action='';if(phase==='playing'&&!clueMode)action=`<div class="notice gold">Choose an <b>unfired element</b> on the enemy table. Then answer a chemistry question to launch that attack.</div>`;else if(phase==='playing'&&clueMode)action=`<div class="question"><div class="kicker">CLUE TARGET · FIND THE ELEMENT</div><h3>${esc(clue.prompt)}</h3><div class="hint">Choose the correct element on the enemy board to fire at it.</div></div>`;else if(phase==='question')action=`<div class="question"><div class="kicker">ELEMENT CHALLENGE · ${esc(BY_Z[question.z].s)} TARGET</div><h3>${esc(question.prompt)}</h3>${question.options.map((x,i)=>`<button type="button" class="answer" data-choice="${i}">${String.fromCharCode(65+i)}. ${esc(x)}</button>`).join('')}</div>`;let note=feedback?`<div class="notice bad" role="status">${esc(feedback)}</div>`:'';let timer=deadline>0&&(phase==='playing'&&clueMode||phase==='question')?`<div id="timerWrap" class="notice gold"><div style="display:flex;justify-content:space-between"><b>Timed fire</b><b id="countdown">${Math.ceil((deadline-Date.now())/1000)} s</b></div><div class="meter"><div id="timerBar"></div></div></div>`:'';return `<div class="play"><section class="leftcol"><div class="card board-card">${titleBar('🎯 Enemy Waters — Choose an Element',`${fired} attacks recorded`)}<div class="hint">${clueMode?'Identify the element from the clue.':'Pick a target tile; answer a question to fire.'} Red ✕ = hit. Dark · = miss. The actual periodic-table shape is preserved.</div>${mainboard}<div class="legend"><span><i class="dot hit"></i>Hit</span><span><i class="dot miss"></i>Miss</span><span><i class="dot available"></i>Unfired element</span></div></div><div class="card board-card small-board">${titleBar('🛡 Your Fleet',ownShipStats(p))}${homeboard}</div></section><aside class="sidebar"><div class="card"><div class="turn-label">${esc(p.name)}'S TURN · ${attackKind==='clue'?'CLUE HUNT':'CLICK & ANSWER'}</div><div class="bigline">${clueMode?'Find the signal':'Choose your target'}</div><div class="statgrid"><div class="statbox"><b>${p.shots&&Object.values(p.shots).filter(s=>s==='hit').length||0}</b>Enemy tiles hit</div><div class="statbox"><b>${ownShipStats(opp)}</b>Enemy fleet left</div></div>${action}${note}${timer}<div class="hint">${esc(CHALLENGES[CFG.difficulty])}. ${CFG.attack==='mixed'?'Mixed mode alternates question and clue attacks.':''}</div></div>${referencePanel()}</aside></div>`;}
function referencePanel(){if(!CFG.reference)return `<div class="card hint"><b>Study reference hidden</b><p>To use element names and the reference sheet, enable the reference option at setup.</p></div>`;return `<details class="reference"><summary>📘 Periodic table study reference</summary><p>Use this when learning. Atomic weights shown in u; for radioactive elements, the mass shown may refer to a representative isotope rather than a standard atomic weight.</p><input type="search" id="refFilter" placeholder="Filter by name, symbol, number…" aria-label="Search element reference"><div class="reference-list" id="refList">${available.map(e=>`<div data-ref="${esc((e.name+' '+e.s+' '+e.z).toLowerCase())}"><b>${e.z}. ${esc(e.s)}</b> ${esc(e.name)} <span style="color:#aacddd">${e.mass}</span></div>`).join('')}</div></details>`;}
function interstitial(){const target=players[active]?.name||'Player';return `<div class="shield card"><div class="badge-emoji" aria-hidden="true">🔒</div><div class="overline">PRIVATE SCREEN · PASS & PLAY</div><h2>Pass the device to ${esc(target)}</h2><p class="desc">Previous player: look away. Only ${esc(target)} should continue. The other player's fleet stays hidden.</p><button class="btn" data-action="unshield">I'm ${esc(target)} — Continue →</button></div>`;}
function resultScreen(){const p=players[active];return `<div class="shield card"><div class="badge-emoji">${resultOver?'🏆':resultGood?'🎯':'🌊'}</div><div class="overline">${resultOver?'MISSION COMPLETE':esc(p.name)+' · ATTACK REPORT'}</div><h2>${resultOver?`${esc(p.name)} wins the science fleet battle!`:'Attack resolved'}</h2><div class="notice ${resultGood?'good':'gold'}" role="status">${esc(resultText)}</div><p class="desc">${resultOver?'Every enemy ship is sunk. Excellent chemistry practice and careful targeting!':'Each correct science challenge launches exactly one shot. Hits and misses both advance the turn.'}</p>${resultOver?`<button class="btn" data-action="restart">Play again</button><button class="btn alt" data-action="reveal" style="margin-left:7px">Review final boards</button>`:`<button class="btn" data-action="next">${CFG.opponent==='human'?'Pass to next player':'Continue'} →</button>`}</div>`;}
function finalBoard(){return `<div class="card" style="max-width:1230px;margin:15px auto"><h2>Final fleet report</h2><p class="hint">All ship positions are revealed at the end of the match.</p>${players.map((p,i)=>`<h3>${esc(p.name)}'s fleet</h3>${board({ships:p.ships,shots:players[1-i].shots,interactive:false})}`).join('')}<button class="btn" data-action="restart">New game</button></div>`;}
function computerWaiting(){const p=players[0];return `<div class="play"><section class="leftcol"><div class="card board-card">${titleBar('🛡 Your Fleet','COMPUTER TURN')}${board({ships:p.ships,shots:players[1].shots,interactive:false})}</div></section><aside class="sidebar"><div class="card"><div class="turn-label">COMPUTER CAPTAIN</div><div class="bigline">Enemy ship radar active</div><p class="desc">The computer chooses its target using only visible hit-and-miss results, not your hidden ship locations.</p><button class="btn" data-action="computerFire">Show computer attack →</button></div></aside></div>`;}
function render(){clearInterval(timerHandle);timerHandle=null;badge.textContent=phase==='setup'?'SCIENCE FLEET':phase==='placement'?'FLEET DEPLOYMENT':phase==='handoff'?'PRIVATE HANDOFF':phase==='playing'||phase==='question'?'BATTLE IN PROGRESS':phase==='computer'?'COMPUTER TURN':'BATTLE REPORT';resetBtn.hidden=phase==='setup';if(phase==='setup')app.innerHTML=settings();else if(phase==='placement')app.innerHTML=renderPlacement();else if(phase==='handoff')app.innerHTML=interstitial();else if(phase==='playing'||phase==='question')app.innerHTML=playContent();else if(phase==='result')app.innerHTML=resultScreen();else if(phase==='computer')app.innerHTML=computerWaiting();else if(phase==='gameover')app.innerHTML=finalBoard();if(deadline>0&&(phase==='question'||phase==='playing'&&attackKind==='clue')){timerHandle=setInterval(tick,140);tick()}}
function startClock(){clearInterval(timerHandle);timerHandle=null;deadline=0;const seconds=CFG.difficulty==='nightmare'?15:CFG.timer;if(seconds>0)deadline=Date.now()+seconds*1000;}
function tick(){if(!deadline)return;const ms=deadline-Date.now();const bar=document.getElementById('timerBar'),count=document.getElementById('countdown');if(bar)bar.style.width=Math.max(0,100*ms/(1000*(CFG.difficulty==='nightmare'?15:CFG.timer)))+'%';if(count)count.textContent=Math.max(0,Math.ceil(ms/1000))+' s';if(ms<=0){clearInterval(timerHandle);timerHandle=null;deadline=0;endShot('⏱ Time expired. The attack did not fire.',false,false)}}
function allDifferent(correct,pool){const uniq=[...new Set(pool.map(String))].filter(a=>a!==String(correct));const picks=shuffle(uniq).slice(0,2);while(picks.length<2)picks.push(correct+'?'+picks.length);const a=shuffle([String(correct),...picks]);return {options:a,correctIndex:a.indexOf(String(correct))}}
function buildQuestion(e){const tier=CFG.level;const canMass=e.stableMass;const kinds=tier==='explorer'?['name','symbol','atomic','name']:tier==='scientist'?['name','atomic','period','symbol','group','family']:tier==='chemist'?['atomic','family','period','group',...(canMass?['mass']:[]),'symbol','name']:['family','group','period',...(canMass?['mass']:[]),'valence','atomic','name','symbol'];let kind=rand(kinds);if(kind==='valence'&&!(e.group===1||e.group===2||e.group>=13)&&e.z!==2)kind='period';if(kind==='family'&&['Other element','Post-transition metal','Metalloid','Nonmetal'].includes(e.cat))kind='period';if(kind==='group'&&e.group===0)kind='family';const peers=available.filter(x=>x.z!==e.z);let prompt='',correct='',pool=[],hint='',why='';
if(kind==='name'){prompt=`Which element is represented by the symbol ${e.s}?`;correct=e.name;pool=peers.map(x=>x.name);hint='The symbol may be one or two letters; compare it with the name in the study reference.';why=`${e.s} is the chemical symbol for ${e.name}.`}
else if(kind==='symbol'){prompt=`Which symbol belongs to ${e.name}?`;correct=e.s;pool=peers.map(x=>x.s);hint='A chemical symbol begins with a capital letter; a second letter is lowercase.';why=`The correct symbol for ${e.name} is ${e.s}.`}
else if(kind==='atomic'){prompt=`What is the atomic number of ${e.name} (${e.s})?`;correct=String(e.z);pool=peers.filter(x=>Math.abs(x.z-e.z)<=13).map(x=>String(x.z));hint='The atomic number equals the number of protons in one atom.';why=`${e.name} has ${e.z} protons, so its atomic number is ${e.z}.`}
else if(kind==='period'){prompt=`Which period (horizontal row) contains ${e.name} (${e.s})?`;correct=String(e.period);pool=[1,2,3,4,5,6,7].filter(x=>x!==e.period).map(String);hint='Periods are numbered 1–7 from top to bottom; the f-block belongs to periods 6 and 7.';why=`${e.name} belongs to Period ${e.period}.`}
else if(kind==='group'){prompt=`Which group (vertical column) contains ${e.name} (${e.s})?`;correct=String(e.group);pool=[e.group-2,e.group-1,e.group+1,e.group+2,1,2,13,17,18].filter(x=>x>=1&&x<=18&&x!==e.group).map(String);hint='Group numbers run 1–18 across the top of the standard periodic table.';why=`${e.name} is in Group ${e.group}.`}
else if(kind==='family'){prompt=`Which element family best describes ${e.name} (${e.s})?`;correct=e.cat;pool=['Alkali metal','Alkaline earth metal','Halogen','Noble gas','Transition metal','Lanthanide','Actinide','Metalloid','Nonmetal'];hint=`Check ${e.name}'s location: Group 1 (except H), Group 2, Group 17, Group 18, the d-block, or the two detached series.`;why=`${e.name} is classified as a ${e.cat.toLowerCase()}.`}
else if(kind==='mass'){prompt=`What is the approximate atomic weight of ${e.name} (${e.s}), rounded to the nearest whole u?`;correct=String(Math.round(e.mass));pool=[...peers.filter(x=>x.stableMass&&Math.abs(x.mass-e.mass)<22).map(x=>String(Math.round(x.mass))),String(Math.round(e.mass)+8),String(Math.max(1,Math.round(e.mass)-8))];hint='Atomic weight is measured in unified atomic mass units (u), not the same as atomic number.';why=`${e.name}'s standard atomic weight is approximately ${e.mass} u, or ${Math.round(e.mass)} u when rounded.`}
else if(kind==='valence'){let value=e.z===2?2:e.group<=2?e.group:e.group-10;prompt=`How many valence electrons does a neutral ${e.name} atom have in the usual main-group model?`;correct=String(value);pool=[1,2,3,4,5,6,7,8].filter(x=>x!==value).map(String);hint='For a main-group element, Group 1 has one valence electron, Group 2 has two, and Groups 13–18 usually have 3–8. Helium has two.';why=`${e.name} has ${value} valence electron${value===1?'':'s'} in the usual main-group model.`}
const {options,correctIndex}=allDifferent(correct,pool);return {z:e.z,kind,prompt,options,correctIndex,hint,why}}
function buildClue(e){const tier=CFG.level;let type=rand(tier==='explorer'?['name','atomic','name','symbol']:tier==='scientist'?['name','atomic','symbol','periodGroup']:['atomic','symbol','periodGroup','name']);if(type==='periodGroup'&&e.group===0)type='atomic';if(type==='name')return {z:e.z,prompt:`Find ${e.name}. Which element tile is it?`,hint:`Look for the symbol ${e.s}.`,why:`${e.name} uses the symbol ${e.s}, atomic number ${e.z}.`};if(type==='atomic')return {z:e.z,prompt:`Find the element with atomic number ${e.z}.`,hint:`Each tile shows its atomic number at the top.`,why:`Atomic number ${e.z} is ${e.name} (${e.s}).`};if(type==='symbol')return {z:e.z,prompt:`Find the element whose chemical symbol is ${e.s}.`,hint:`Locate ${e.s} in the table. Every symbol refers to just one element.`,why:`${e.s} stands for ${e.name}.`};return {z:e.z,prompt:`Find the element in Period ${e.period}, Group ${e.group}.`,hint:`Periods are horizontal rows and groups are vertical columns.`,why:`Period ${e.period}, Group ${e.group} identifies ${e.name} (${e.s}).`}}
function onElement(z){if(phase==='placement'){place(z);return}if(phase!=='playing'||players[active].computer)return;const p=players[active];if(p.shots[z])return;if(attackKind==='clue'){if(z===clue.z){deadline=0;const note=`Correct! ${clue.why} `;fire(z,note)}else wrongClue();return}question=buildQuestion(BY_Z[z]);phase='question';attempts=0;feedback='';startClock();render();}
function wrongClue(){attempts++;mistakes++;const maximum=CFG.difficulty==='training'?999:CFG.difficulty==='standard'?2:1;if(attempts>=maximum){deadline=0;endShot(`Incorrect identification. The clue was: ${clue.prompt} No shot was fired.`,false,false);return}feedback=`Not quite. ${clue.hint} You have ${maximum-attempts===999?'more tries':maximum-attempts+' try left'}.`;render();}
function onAnswer(i){if(phase!=='question'||!question)return;const correct=i===question.correctIndex;if(correct){deadline=0;fire(question.z,`Correct! ${question.why} `);return}attempts++;mistakes++;const maximum=CFG.difficulty==='training'?999:CFG.difficulty==='standard'?2:1;if(attempts>=maximum){deadline=0;endShot(`No shot: ${question.why}`,false,false);return}feedback=`Not quite. Hint: ${question.hint} Try again.`;render();}
function fire(z,prefix=''){const attacker=players[active],defender=players[1-active];if(attacker.shots[z])return;deadline=0;const e=BY_Z[z],ship=defender.ships.find(s=>s.cells.includes(z));const hit=!!ship;attacker.shots[z]=hit?'hit':'miss';let status=hit?'HIT!':'Miss.';let sunk=false;if(ship&&ship.cells.every(id=>attacker.shots[id]==='hit')){sunk=true;status=`SHIP SUNK! (${ship.length} element tiles)`;attacker.sunkKnown.push(...ship.cells)}const won=defender.ships.every(s=>s.cells.every(id=>attacker.shots[id]==='hit'));const attackDesc=`${e.name} (${e.s}, #${z}): ${status}`;endShot(prefix+attackDesc,hit,won);}
function endShot(text,good,over){clearInterval(timerHandle);timerHandle=null;deadline=0;resultText=text;resultGood=good;resultOver=over;players[active].turnShots++;turns++;if(over)winner=active;phase='result';render();}
function nextTurn(){if(resultOver){phase='gameover';render();return}active=1-active;if(players[active].computer){phase='computer';render();return}if(CFG.opponent==='human'){phase='handoff';handoffNext='playing';render()}else startHumanTurn();}
function aiCandidates(p){return available.filter(e=>!p.shots[e.z]).map(e=>e.z)}
function neighbors(z){const e=BY_Z[z];return [[e.row-1,e.col],[e.row+1,e.col],[e.row,e.col-1],[e.row,e.col+1]].map(([r,c])=>POS[`${r}-${c}`]).filter(v=>v&&availableSet.has(v))}
function aiChoose(){const ai=players[1],remaining=aiCandidates(ai),knownSunk=new Set(ai.sunkKnown),hitSet=new Set(Object.entries(ai.shots).filter(([z,v])=>v==='hit'&&!knownSunk.has(+z)).map(([z])=>+z));const hunt=shuffle([...new Set([...hitSet].flatMap(neighbors).filter(z=>!ai.shots[z]))]);if(CFG.ai==='rookie')return rand(remaining);if(CFG.ai==='captain')return hunt.length&&Math.random()<.75?rand(hunt):rand(remaining);if(CFG.ai==='admiral'){if(hunt.length)return rand(hunt);const parity=remaining.filter(z=>(BY_Z[z].row+BY_Z[z].col)%2===0);return rand(parity.length?parity:remaining)}
 // Probability search: score only observed misses, known sunk tiles, and unsunk hits. Never consult undiscovered ship locations.
 const scores=new Map(remaining.map(z=>[z,0]));const sizes=fleet.filter(len=>true);for(const len of sizes){for(const orient of ['h','v'])for(const path of pathsFor(len,orient)){if(path.some(z=>ai.shots[z]==='miss'||knownSunk.has(z)))continue;const included=path.filter(z=>hitSet.has(z)).length;let score=(1+included*12);if(hitSet.size&&!included)score*=.08;for(const z of path)if(scores.has(z))scores.set(z,scores.get(z)+score)}}let best=-Infinity,choices=[];for(const [z,score] of scores){if(score>best){best=score;choices=[z]}else if(score===best)choices.push(z)}return rand(choices.length?choices:remaining);}
function computerFire(){if(phase!=='computer')return;const prev=active;active=1;const z=aiChoose();if(!z){phase='gameover';winner=-1;render();return}fire(z,`Computer Captain targeted ${BY_Z[z].s}. `);}
function unshield(){if(phase!=='handoff')return;if(handoffNext==='placement'){phase='placement';message='Place your fleet. The other player cannot see your ship positions.';render()}else startHumanTurn();}
function onAction(action){if(action==='begin')begin();else if(action==='rotate')rotate();else if(action==='auto'){players[active].ships=randomFleet();placementIndex=fleet.length;message='All ships placed automatically. You may start, or clear and arrange your own.';render()}else if(action==='clear'){players[active].ships=[];placementIndex=0;message='Fleet cleared. Place a ship to begin.';render()}else if(action==='ready')placementReady();else if(action==='unshield')unshield();else if(action==='next')nextTurn();else if(action==='computerFire')computerFire();else if(action==='restart'){clearInterval(timerHandle);timerHandle=null;deadline=0;phase='setup';render()}else if(action==='reveal'){phase='gameover';render()}}
app.addEventListener('click',event=>{const action=event.target.closest('[data-action]');if(action){onAction(action.dataset.action);return}const choice=event.target.closest('[data-choice]');if(choice){onAnswer(+choice.dataset.choice);return}const tile=event.target.closest('[data-z]');if(tile){onElement(+tile.dataset.z)}});
app.addEventListener('input',event=>{if(event.target.id==='refFilter'){const q=event.target.value.toLowerCase().trim();document.querySelectorAll('#refList [data-ref]').forEach(el=>el.hidden=!el.dataset.ref.includes(q))}});
app.addEventListener('change',event=>{if(event.target.id==='level'){const level=event.target.value;const coverage=document.getElementById('coverage');coverage.value=TIERS[level].cap;const hint=document.getElementById('levelHint');hint.textContent=TIERS[level].desc+'. Ships may be placed only across neighboring active element tiles.'}});
resetBtn.addEventListener('click',()=>{if(confirm('Start a new game? The current fleets and attacks will be lost.')){clearInterval(timerHandle);deadline=0;phase='setup';render()}});
render();
</script>
</body>
