 const hit=opts.shots?.[e.z]==='hit',miss=opts.shots?.[e.z]==='miss';const canClick=opts.interactive&&!hit&&!miss;const selected=opts.selected===e.z;

 className+=' '+(categories[e.cat]||'post');if(ship)className+=' ship vessel-'+vessel.key;
 if(hit)className+=' hit';if(miss)className+=' miss';if(canClick)className+=' interactive';if(selected)className+=' selected';

   shuffledQuestion(e.z,'massModel','MEASUREMENT & EVIDENCE',`A reference lists ${e.name}'s atomic number as ${e.z}, and mass number ${Math.round(e.mass)} for a representative isotope. What is the difference between these numbers?`,'Atomic number counts protons; mass number counts protons plus neutrons',[
 'Atomic number counts neutrons; mass number counts only electrons','Both numbers always count the atom’s electrons','Atomic number gives electron shells; mass number gives protons'],`For elements without a standard atomic weight, references sometimes show a representative isotope mass number.`,`Atomic number is the proton count. The mass number of an isotope is protons plus neutrons.`),
 groupAnalogy:(e)=>{if(e.group===0||e.z===1||e.group===1&&e.z===1)return null;const same=members(e).filter(x=>x.z!==1),different=available.filter(x=>x.group!==e.group&&x.z!==e.z);
   if(!same.length||different.length<3)return null;const peer=rand(same);
   const distract=shuffle(different).slice(0,3).map(x=>x.name);
   return shuffledQuestion(e.z,'groupAnalogy','REPEATING PATTERNS',`A student wants an element in the same vertical group as ${e.name}. Which choice should the student investigate?`,peer.name,distract,`Locate ${e.s}, then follow its column up or down.`,`Both ${e.name} and ${peer.name} are in Group ${e.group}, so their outer-electron patterns can be related.`);},
 valence:(e)=>{if(!isMain(e))return null;
  const n=e.z===2?2:e.group<=2?e.group:e.group-10;
  return shuffledQuestion(e.z,'valence','OUTER ELECTRONS',`In the main-group model, how many valence electrons does neutral ${e.name} have?`,n,[n-1,n+1,n+2,n-2,8,2,1,6].filter(x=>x>=1&&x<=8),`Group 1 has 1, Group 2 has 2, and Groups 13–18 usually have 3–8; helium has 2.`,`The group of ${e.name} indicates ${n} outer-shell electron${n===1?'':'s'} in this model.`);},
 charge:(e)=>{const charges={1:1,2:2,13:3,15:-3,16:-2,17:-1};if(!charges[e.group]||e.z===1||e.z>54||e.group===13&&e.z!==13||e.group===15&&e.z>15)return null;
  const n=charges[e.group],f=x=>x>0?`${x}+`:`${Math.abs(x)}−`;
  return shuffledQuestion(e.z,'charge','ION FORMATION',`Using a common main-group ion model, what charge is predicted when ${e.name} forms a simple monatomic ion?`,f(n),[f(-n),f(n>0?n+1:n-1),f(n>0?n===1?3:n-1:n===-1?-3:n+1),f(n>0?-n-1:-n+1)],`Use its valence-electron pattern to predict loss or gain of electrons.`,`The simplified model predicts ${f(n)} for ${e.name} (Group ${e.group}).`);},
 ionic:(e)=>{const charges={1:1,2:2,13:3,15:-3,16:-2,17:-1};if(!charges[e.group]||e.z===1||e.z>54||e.group===13&&e.z!==13||e.group===15&&e.z>15)return null;
  const charge=charges[e.group],p=Math.abs(charge),anion=charge<0,partner=anion?'Na':'Cl',left=anion?'Na':e.s,right=anion?e.s:'Cl',c=anion?1:p,an=anion?p:1;
  const g=(a,b)=>{let x=a,y=b;while(y)[x,y]=[y,x%y];return x;};const gcd=g(c,an),leftN=an/gcd,rightN=c/gcd;
  const formula=chemical(left,leftN)+chemical(right,rightN);
  const distract=[chemical(left,rightN)+chemical(right,leftN),chemical(left,leftN+1)+chemical(right,rightN),chemical(left,leftN)+chemical(right,rightN+1),chemical(left,1)+chemical(right,1),chemical(left,Math.max(1,leftN-1))+chemical(right,rightN+1),chemical(left,3)+chemical(right,1),chemical(left,1)+chemical(right,3)];
  return shuffledQuestion(e.z,'ionic','CHEMICAL FORMULAS',`Predict the simplest charge-balanced formula for a compound containing ${e.name} and ${partner==='Na'?'sodium':'chlorine'}, using common simple-ion charges.`,formula,distract,`The sum of positive and negative charges must be zero, using the smallest whole-number ratio.`,`The ion charges are ${charge>0?'+'+charge:charge} and ${anion?'+1':'−1'}; the smallest neutral ratio is ${formula}.`);},
 radius:(e)=>{if(!isMain(e)||e.group===0||e.group===18||e.z===1||e.z>54)return null;
  const peers=members(e).filter(x=>x.z!==1&&x.z<=54);if(!peers.length)return null;const other=rand(peers),larger=e.period>other.period?e:other,smaller=larger===e?other:e;
  return shuffledQuestion(e.z,'radius','PERIODIC TRENDS',`Two elements share Group ${e.group}: ${e.name} (Period ${e.period}) and ${other.name} (Period ${other.period}). Which prediction best follows the general trend in atomic radius?`,`${larger.name} has the larger atomic radius`,[`${smaller.name} has the larger atomic radius`,'Both must have identical radii','Their radius depends only on atomic number being odd or even'],`Within a group, atomic radius generally increases as you move downward.`,`The element farther down the group, ${larger.name}, generally has the larger atomic radius.`);},
 reactivity:(e)=>{if(e.group!==1&&e.group!==17||e.z===1||e.z>54)return null;const peers=members(e).filter(x=>x.z!==1&&x.z<=54);if(!peers.length)return null;
  const other=rand(peers),higher=moreReactivity(e,other),lower=higher===e?other:e;
  return shuffledQuestion(e.z,'reactivity','PREDICTING REACTIVITY',`Compare ${e.name} and ${other.name} in Group ${e.group}. Which prediction matches their common group-reactivity trend?`,`${higher.name} is generally more reactive`,[`${lower.name} is generally more reactive`,'Both are always equally reactive','The element with more protons always reacts faster'],`Alkali metals generally become more reactive down their group; halogens generally become more reactive up their group.`,`The common Group ${e.group} trend predicts ${higher.name} is generally more reactive than ${lower.name}.`);},
 bonds:(e)=>{if(!isMain(e)||e.z===1)return null;const val=e.z===2?2:e.group<=2?e.group:e.group-10;if(e.group===18)return null;
  return shuffledQuestion(e.z,'bonds','OUTER ELECTRONS & BONDING',`An element in the same main-group column as ${e.name} is examined. Which evidence most strongly supports a prediction that it will show similar chemical behavior?`,'It has a similar outer-electron pattern',[
 'It has nearly the same total atomic mass','Its nucleus contains the same number of neutrons','It was discovered in the same century'],`Group patterns reflect electrons in the outermost occupied energy level.`,`Elements in the same main-group column often share valence-electron patterns and therefore have related chemistry.`);},
 shells20:(e)=>{if(e.z>20||e.z<3)return null;const n=e.z,parts=[];let rest=n;for(const cap of [2,8,8,2]){if(rest>0){const take=Math.min(cap,rest);parts.push(take);rest-=take;}}
  const target=parts.join('–');const wrong=[...new Set([`${parts[0]}–${n-parts[0]}`,`${n}`,`${parts.join('–')}–1`,[...parts].reverse().join('–'),`${parts[0]}–${parts[1]||0}–${n}`])];

 claim:(e)=>{const other=e.group!==0?members(e).filter(x=>x.z!==1):[];if(!other.length||e.z===1)return null;const peer=rand(other);
  return shuffledQuestion(e.z,'claim','CLAIMS & EVIDENCE',`Two students compare ${e.name} and ${peer.name}. Which claim is supported by their positions in the periodic table?`,'They are in the same group, so they have related periodic patterns',[
 'They contain the same total number of protons','They must have exactly the same atomic mass','They are necessarily the same isotope'],`Look for a claim supported by column position rather than identical atomic particles.`,`Both elements are in Group ${e.group}. Their proton counts and masses differ, but their positions reveal a repeating pattern.`);},
};
const TIER_QUESTIONS={
 explorer:['atomic','name','symbol','neutral','neighbor','family','atomic','name','symbol','neutral','neighbor','family'],
 scientist:['neutral','isotope','atoms','groupAnalogy','family','period','ion','shell','isotopeVsIon','massModel','neighbor','atomic','neutral','atoms','groupAnalogy'],
 chemist:['ion','isotope','atoms','groupAnalogy','radius','charge','family','massModel','isotopeVsIon','shell','claim','period','neutral','radius','isotope','atoms','groupAnalogy'],
 master:['ionic','valence','reactivity','radius','isotope','ion','shells20','groupAnalogy','bonds','claim','massModel','charge','family','atoms','isotope','ionic','radius','reactivity','valence','claim']
};
const CLUE_QUESTIONS={
 explorer:['neighbor','family','name','symbol','atomic','neutral','neighbor','family'],
 scientist:['groupAnalogy','atoms','neutral','isotope','period','ion','family','shell','groupAnalogy'],
 chemist:['radius','groupAnalogy','ion','isotope','claim','charge','massModel','atoms','radius'],
 master:['reactivity','ionic','radius','bonds','claim','ion','isotope','valence','shells20','ionic','reactivity']
};
function pickTierQuestion(e,clueMode){
 const keys=(clueMode?CLUE_QUESTIONS:TIER_QUESTIONS)[CFG.level];
 // Retry with random order, then guaranteed generic atomic structure fallback.
 for(const key of shuffle(keys)){
   const generator=modelKinds[key];
   if(!generator)continue;
   try {const q=generator(e);if(q){if(clueMode){q.skill=`CLUE ANALYSIS · ${q.skill}`;}return q}} catch(err){console.warn('Skipped invalid',key,e.s,err.message)}
 }
 return modelKinds.atomic(e);
}
function buildQuestion(e){return pickTierQuestion(e,false)}
function buildClueQuestion(e){return pickTierQuestion(e,true)}

function onElement(z){
 if(phase==='placement'){place(z);return}
 if(phase!=='playing'||players[active].computer)return;
 if(players[active].shots[z])return;
 question=attackKind==='clue'?buildClueQuestion(BY_Z[z]):buildQuestion(BY_Z[z]);
 phase='question';attempts=0;feedback='';startClock();if(phase==='question')render();
}
function changeTarget(){
 if(phase!=='question')return;
 clearInterval(timerHandle);timerHandle=null;retargetDeadline=deadline;deadline=0;
 question=null;attempts=0;feedback='';phase='playing';render();
}
function onAnswer(i){if(phase!=='question'||!question)return;const correct=i===question.correctIndex;if(correct){deadline=0;fire(question.z,`Correct! ${question.why} `);return}attempts++;mistakes++;const maximum=CFG.difficulty==='training'?999:CFG.difficulty==='standard'?2:1;if(attempts>=maximum){deadline=0;endShot(`No shot: ${question.why}`,false,false);return}feedback=`Not quite. Hint: ${question.hint} Try again.`;render();}
function fire(z,prefix=''){
 const attacker=players[active],defender=players[1-active];if(attacker.shots[z])return;
 deadline=0;const e=BY_Z[z],ship=defender.ships.find(s=>s.cells.includes(z));const hit=!!ship;
 attacker.shots[z]=hit?'hit':'miss';let status=hit?'HIT!':'Miss.';let sunk=false;
 if(ship&&ship.cells.every(id=>attacker.shots[id]==='hit')){
  sunk=true;const vessel=rosterShip(ship);
  status=vessel.key==='operator'?`SEAL TEAM OPERATOR LOCATED! (1 tile)`:`${vessel.name.toUpperCase()} SUNK! (${vessel.length} tiles)`;
  attacker.sunkKnown.push(...ship.cells);
 }
 const won=defender.ships.every(s=>s.cells.every(id=>attacker.shots[id]==='hit'));
 const attackDesc=`${e.name} (${e.s}, #${z}): ${status}`;
 endShot(prefix+attackDesc,hit,won);
}
function endShot(text,good,over){clearInterval(timerHandle);timerHandle=null;deadline=0;retargetDeadline=0;resultText=text;resultGood=good;resultOver=over;players[active].turnShots++;turns++;if(over)winner=active;phase='result';render();}
function nextTurn(){if(resultOver){phase='gameover';render();return}active=1-active;if(players[active].computer){phase='computer';render();return}if(CFG.opponent==='human'){phase='handoff';handoffNext='playing';render()}else startHumanTurn();}
function aiCandidates(p){return available.filter(e=>!p.shots[e.z]).map(e=>e.z)}
function neighbors(z){const e=BY_Z[z];return [[e.row-1,e.col],[e.row+1,e.col],[e.row,e.col-1],[e.row,e.col+1]].map(([r,c])=>POS[`${r}-${c}`]).filter(v=>v&&availableSet.has(v))}
function aiChoose(){const ai=players[1],remaining=aiCandidates(ai),knownSunk=new Set(ai.sunkKnown),hitSet=new Set(Object.entries(ai.shots).filter(([z,v])=>v==='hit'&&!knownSunk.has(+z)).map(([z])=>+z));const hunt=shuffle([...new Set([...hitSet].flatMap(neighbors).filter(z=>!ai.shots[z]))]);if(CFG.ai==='rookie')return rand(remaining);if(CFG.ai==='captain')return hunt.length&&Math.random()<.75?rand(hunt):rand(remaining);if(CFG.ai==='admiral'){if(hunt.length)return rand(hunt);const parity=remaining.filter(z=>(BY_Z[z].row+BY_Z[z].col)%2===0);return rand(parity.length?parity:remaining)}
 // Probability search: score only observed misses, known sunk tiles, and unsunk hits. Never consult undiscovered ship locations.
 const scores=new Map(remaining.map(z=>[z,0]));const sizes=fleet.filter(len=>true);for(const len of sizes){for(const orient of ['h','v'])for(const path of pathsFor(len,orient)){if(path.some(z=>ai.shots[z]==='miss'||knownSunk.has(z)))continue;const included=path.filter(z=>hitSet.has(z)).length;let score=(1+included*12);if(hitSet.size&&!included)score*=.08;for(const z of path)if(scores.has(z))scores.set(z,scores.get(z)+score)}}let best=-Infinity,choices=[];for(const [z,score] of scores){if(score>best){best=score;choices=[z]}else if(score===best)choices.push(z)}return rand(choices.length?choices:remaining);}
function computerFire(){if(phase!=='computer')return;const prev=active;active=1;const z=aiChoose();if(!z){phase='gameover';winner=-1;render();return}fire(z,`Computer Captain targeted ${BY_Z[z].s}. `);}
function unshield(){if(phase!=='handoff')return;if(handoffNext==='placement'){phase='placement';message='Place your fleet. The other player cannot see your ship positions.';render()}else startHumanTurn();}
function onAction(action){if(action==='begin')begin();else if(action==='rotate')rotate();else if(action==='auto'){players[active].ships=randomFleet().map((ship,id)=>({...ship,id}));placementIndex=fleet.length;message='All ships placed automatically. You may start, or clear and arrange your own.';render()}else if(action==='clear'){players[active].ships=[];placementIndex=0;message='Fleet cleared. Place a ship to begin.';render()}else if(action==='ready')placementReady();else if(action==='unshield')unshield();else if(action==='changeTarget')changeTarget();else if(action==='next')nextTurn();else if(action==='computerFire')computerFire();else if(action==='restart'){clearInterval(timerHandle);timerHandle=null;deadline=0;phase='setup';render()}else if(action==='reveal'){phase='gameover';render()}}
app.addEventListener('click',event=>{const action=event.target.closest('[data-action]');if(action){onAction(action.dataset.action);return}const choice=event.target.closest('[data-choice]');if(choice){onAnswer(+choice.dataset.choice);return}const tile=event.target.closest('[data-z]');if(tile){onElement(+tile.dataset.z)}});
app.addEventListener('input',event=>{if(event.target.id==='refFilter'){const q=event.target.value.toLowerCase().trim();document.querySelectorAll('#refList [data-ref]').forEach(el=>el.hidden=!el.dataset.ref.includes(q))}});
app.addEventListener('change',event=>{if(event.target.id==='level'){const level=event.target.value;const coverage=document.getElementById('coverage');coverage.value=TIERS[level].cap;const hint=document.getElementById('levelHint');hint.textContent=TIERS[level].desc+'. Ships may be placed only across neighboring active element tiles.'}});
resetBtn.addEventListener('click',()=>{if(confirm('Start a new game? The current fleets and attacks will be lost.')){clearInterval(timerHandle);deadline=0;phase='setup';render()}});
render();
